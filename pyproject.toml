[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arex-v2"
version = "0.1.0"
description = "Unified research, Frontier-CS algorithmic, and MLE-bench Lite evaluation entrypoint"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
research = ["openai", "httpx", "requests", "pandas", "pyarrow", "pillow", "pypdf", "rich", "transformers"]
frontier = ["pyyaml", "requests", "openai", "anthropic", "datasets", "tqdm"]
all = ["openai", "httpx", "requests", "pandas", "pyarrow", "pillow", "pypdf", "rich", "transformers", "pyyaml", "anthropic", "datasets", "tqdm"]

[project.scripts]
arex = "arex_v2.cli:main"

[tool.setuptools.packages.find]
include = ["arex_v2*"]
