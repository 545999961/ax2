<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AREX mark</title>
  <desc id="desc">A prism-shaped A made from connected evaluation paths.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="18" x2="230" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15234A"/>
      <stop offset="1" stop-color="#081225"/>
    </linearGradient>
    <linearGradient id="path" x1="52" y1="204" x2="205" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66E3C4"/>
      <stop offset=".52" stop-color="#70A5FF"/>
      <stop offset="1" stop-color="#FFB86C"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".26"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)" filter="url(#shadow)"/>
  <path d="M55 199 115 53c5-12 21-12 26 0l60 146" fill="none" stroke="url(#path)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M81 145h93" fill="none" stroke="#F5F8FF" stroke-width="14" stroke-linecap="round" opacity=".96"/>
  <circle cx="55" cy="199" r="10" fill="#66E3C4"/>
  <circle cx="128" cy="45" r="10" fill="#FFB86C"/>
  <circle cx="201" cy="199" r="10" fill="#70A5FF"/>
  <circle cx="81" cy="145" r="8" fill="#F5F8FF"/>
  <circle cx="174" cy="145" r="8" fill="#F5F8FF"/>
</svg>
